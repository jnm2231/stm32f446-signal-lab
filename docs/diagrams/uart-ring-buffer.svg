<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><rect width="1100" height="620" fill="white"/><text x="45" y="55" font-family="Arial" font-size="28" font-weight="bold" fill="#183153">UART RX Ring Buffer — 64 Slots, 63 Usable</text><g font-family="Arial" fill="#223344" font-size="16" text-anchor="middle"><rect x="70" y="105" width="210" height="70" rx="14" fill="#fff4dc" stroke="#c99b31" stroke-width="2"/><text x="175" y="135">ISR producer</text><text x="175" y="157">owns head / next write</text><rect x="810" y="105" width="220" height="70" rx="14" fill="#e8f5ec" stroke="#5a9b6a" stroke-width="2"/><text x="920" y="135">Main-loop consumer</text><text x="920" y="157">owns tail / next read</text><g font-size="15"><rect x="70" y="250" width="130" height="100" fill="#dff1e4" stroke="#65816c" stroke-width="2"/><rect x="200" y="250" width="130" height="100" fill="#dff1e4" stroke="#65816c" stroke-width="2"/><rect x="330" y="250" width="130" height="100" fill="#dff1e4" stroke="#65816c" stroke-width="2"/><rect x="460" y="250" width="145" height="100" fill="#fff0dc" stroke="#c99b31" stroke-width="2"/><rect x="605" y="250" width="130" height="100" fill="#f4f6f8" stroke="#9aa5b1" stroke-width="2"/><rect x="735" y="250" width="130" height="100" fill="#f4f6f8" stroke="#9aa5b1" stroke-width="2"/><text x="135" y="290">slot 0<tspan x="135" dy="24">TAIL · next read</tspan></text><text x="265" y="302">slot 1</text><text x="395" y="302">slot 2</text><text x="532" y="290">slot 3<tspan x="532" dy="24">HEAD · next write</tspan></text><text x="670" y="302">… slots 4–62</text><text x="800" y="290">slot 63<tspan x="800" dy="24">wrap to 0</tspan></text></g></g><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#52677d"/></marker></defs><path d="M175 175V220H532V250M920 175V220H135V250" fill="none" stroke="#52677d" stroke-width="3" marker-end="url(#arr)"/><g font-family="Arial" font-size="16" fill="#223344"><rect x="70" y="425" width="280" height="105" rx="14" fill="#eef4fb" stroke="#5b7fa3" stroke-width="2"/><text x="95" y="463" font-weight="bold">EMPTY: head == tail</text><text x="95" y="494">No bytes queued</text><rect x="395" y="425" width="355" height="105" rx="14" fill="#fce8e6" stroke="#c76b5c" stroke-width="2"/><text x="420" y="463" font-weight="bold">FULL: next_head == tail</text><text x="420" y="491">Drop newest; uart_rx_dropped++</text><text x="420" y="515">One slot remains unused</text><rect x="795" y="425" width="250" height="105" rx="14" fill="#eef4fb" stroke="#5b7fa3" stroke-width="2"/><text x="820" y="463" font-weight="bold">Wrap-around</text><text x="820" y="491">(index + 1) % 64</text><text x="820" y="515">slot 63 → slot 0</text></g><text x="70" y="580" font-family="Arial" font-size="15" fill="#5c6670">Illustrated queue state: pending items run from tail up to, but not including, head.</text></svg>